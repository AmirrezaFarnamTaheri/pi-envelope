name: Pi fork compatibility

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-jobs:
    name: Job supervisor (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
      - name: Verify detached-job lifecycle without model calls
        run: node --test tests/managed-jobs.test.mjs

  fork-real-runtime:
    name: Envelope against the actual Pi fork
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Envelope candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: envelope
          persist-credentials: false

      - name: Checkout fork main (no write token)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: AmirrezaFarnamTaheri/pi
          ref: main
          path: pi
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'

      - name: Record exact fork commit under test
        shell: bash
        run: |
          printf 'Envelope SHA: %s\n' "$(git -C envelope rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'Fork SHA: %s\n' "$(git -C pi rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build fork source and verify its own check
        working-directory: pi
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run check

      - name: Install and check pinned Envelope dependencies
        working-directory: envelope
        shell: bash
        run: |
          npm install --include=optional --no-audit --no-fund
          npm run doctor:bundle
          npm run check

      - name: Smoke-test Envelope + Tersio on the fork's real CLI
        shell: bash
        working-directory: envelope
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pi-bin" "$RUNNER_TEMP/envelope-ci-home/.tersio"
          printf '{"comboSetupComplete":true,"comboDefault":"off"}\n' > "$RUNNER_TEMP/envelope-ci-home/.tersio/settings.json"
          printf '#!/bin/sh\nexec node "%s/pi/packages/coding-agent/dist/bundle/cli.js" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/pi-bin/pi"
          chmod 700 "$RUNNER_TEMP/pi-bin/pi"
          HOME="$RUNNER_TEMP/envelope-ci-home" PATH="$RUNNER_TEMP/pi-bin:$PATH" npm run smoke:runtime
